# Builds the base images for linux/amd64 and linux/arm64 and pushes them to
# ghcr.io/<owner>/<repo>/runner-<name>. runplane pulls the "latest" tag. A
# weekly build gets the new packages and tool versions. The two matrices
# must name the images and the build args of images/images.go
# (images_test.go compares them).
#
# The arm64 builds use the ubuntu-24.04-arm runners. For a private repository
# without these runners, change the runner to ubuntu-24.04 and add
# docker/setup-qemu-action (the arm64 build is then much slower).
#
# The build context is the images folder, and images/.dockerignore keeps
# only the Dockerfile in it. A change to images.go, its test, or the README
# does not change an image, so it starts no build. A new image changes this
# file too, because the matrices must name it.
name: Images

on:
  push:
    branches: [main]
    paths: ['images/Dockerfile', 'images/.dockerignore', '.github/workflows/images.yml']
  pull_request:
    paths: ['images/Dockerfile', 'images/.dockerignore', '.github/workflows/images.yml']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - {name: ubuntu-24.04, ubuntu: '24.04', image_os: ubuntu24}
          - {name: ubuntu-26.04, ubuntu: '26.04', image_os: ubuntu26}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/runner-${{ matrix.image.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU=${{ matrix.image.ubuntu }}
            IMAGE_OS=${{ matrix.image.image_os }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
      # VM mode copies the image into an ext4 root disk, so keep it small.
      - name: Check the size (3 GB or less)
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} --load -t size-check -q \
            --build-arg UBUNTU=${{ matrix.image.ubuntu }} --build-arg IMAGE_OS=${{ matrix.image.image_os }} images >/dev/null
          mb=$(docker run --rm size-check du -sxm / | cut -f 1)
          echo "Image size: $mb MB"
          if [ "$mb" -gt 3072 ]; then
            echo "::error::${{ matrix.image.name }} uses $mb MB. The limit is 3072 MB."
            exit 1
          fi
      - name: Check that jobs find rustup
        run: docker run --rm -u runner size-check bash -c 'rustup show profile | grep -qx minimal && test -w ~/.rustup && test -w ~/.cargo'
      - name: Keep the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  # Joins the two architectures into one multi-arch tag.
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/runner-${{ matrix.image }}"
          refs=()
          for digest in *; do refs+=("$image@sha256:$digest"); done
          docker buildx imagetools create -t "$image:latest" -t "$image:$(date -u +%Y%m%d)" "${refs[@]}"
          docker buildx imagetools inspect "$image:latest"
